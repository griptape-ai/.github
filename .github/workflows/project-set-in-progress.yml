name: Project — Set In Progress on Iteration + Assignee

# Polls the org project hourly and flips items to In Progress when they are
# scheduled to the current iteration and have at least one assignee. Pairs
# with project-iteration-rollover.yml, which handles the reverse direction.
# Staggered 30m off project-triage-new-issues so the two sweeps don't hit the
# GraphQL API in the same burst.

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log changes without applying them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: project-set-in-progress
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Mint project automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROJECTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: griptape-ai
          # Reads assignees off both Issue and PullRequest item content, so it
          # needs both content permissions. Dropping either one degrades
          # silently: assignee counts read as 0 and items never flip.
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund
      - name: Reconcile In Progress
        working-directory: .github/scripts
        env:
          PROJECTS_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: griptape-ai
          PROJECT_NUMBER: "2"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node set-in-progress.mjs
