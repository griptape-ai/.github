name: Project — Iteration Rollover Sweep

# Once a day, sweeps stale "In Progress" items back to Backlog:
#  - items whose iteration has ended (clears the iteration), and
#  - items with no iteration at all that haven't been touched in 24h.
# Forces a deliberate replan instead of letting silent "In Progress" rot
# accumulate.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log changes without applying them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: project-iteration-rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Mint project automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROJECTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: griptape-ai
          # Reads assignees off both Issue and PullRequest item content, so it
          # needs both content permissions. Dropping either one degrades
          # silently: assignee counts read as 0 and the orphan sweep starts
          # demoting items it should have left alone.
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund
      - name: Roll over ended iterations
        working-directory: .github/scripts
        env:
          PROJECTS_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: griptape-ai
          PROJECT_NUMBER: "2"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node iteration-rollover.mjs
