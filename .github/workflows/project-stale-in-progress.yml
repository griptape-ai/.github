name: Project — Stale In Progress Sweep

# Once a day, moves items that have read "In Progress" for 14 days without a
# status change back to Backlog, commenting on each one to explain the move.
#
# Keyed on age-in-stage (the Status value's own updatedAt), never on Iteration.
# Status is the only field this automation writes and it is derived from nothing,
# so the board cannot contradict itself.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log changes without applying them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: project-stale-in-progress
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Mint project automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROJECTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: griptape-ai
          # Write on issues and pull requests is for the explanatory comment, not
          # the demotion. Without it every demotion lands silently, which is the
          # behaviour this sweep exists to avoid.
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund
      - name: Sweep stale In Progress items
        working-directory: .github/scripts
        env:
          PROJECTS_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: griptape-ai
          PROJECT_NUMBER: "2"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node stale-in-progress.mjs
